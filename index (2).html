<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brahmastra Notes Hub — Complete Notes for Class 6 to 12</title>
<meta name="description" content="Brahmastra Notes Hub — complete, chapter-wise study notes for Class 6 to 12. Single subject ₹99, full class bundle ₹199.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1330;
  --navy-2:#101d45;
  --navy-3:#162457;
  --blue:#3B6CFF;
  --blue-light:#7EA0FF;
  --gold:#F5A623;
  --gold-light:#FFD180;
  --white:#FFFFFF;
  --offwhite:#F4F7FE;
  --ink:#0B1330;
  --muted:#5B6B8C;
  --muted-2:#8B99B8;
  --line:#E4E9F7;
  --danger:#E5484D;
  --success:#2FAE68;
  --radius:14px;
  --shadow:0 10px 30px -12px rgba(10,19,48,.25);
  --shadow-lg:0 24px 60px -20px rgba(10,19,48,.4);
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--offwhite);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:1rem;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--gold-light);color:var(--navy);}

/* ---------- Layout helpers ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.section{padding:72px 0;}
.center{text-align:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--blue);
  background:rgba(59,108,255,.08);border:1px solid rgba(59,108,255,.18);
  padding:6px 12px;border-radius:100px;
}
.grid{display:grid;gap:22px;}
.grid.classes{grid-template-columns:repeat(4,1fr);}
.grid.subjects{grid-template-columns:repeat(3,1fr);}
.grid.features{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.grid.classes{grid-template-columns:repeat(3,1fr);}.grid.subjects{grid-template-columns:repeat(2,1fr);}.grid.features{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.classes{grid-template-columns:repeat(2,1fr);}.grid.subjects{grid-template-columns:1fr;}.grid.features{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:10px;font-weight:600;font-size:.94rem;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px -6px rgba(59,108,255,.55);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(59,108,255,.6);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#E9911A);color:var(--navy);box-shadow:0 8px 20px -6px rgba(245,166,35,.55);}
.btn-gold:hover{transform:translateY(-2px);}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-ghost-dark{background:transparent;border:1.5px solid rgba(255,255,255,.25);color:#fff;}
.btn-ghost-dark:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:8px 14px;font-size:.82rem;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.btn-danger{background:rgba(229,72,77,.1);color:var(--danger);border:1px solid rgba(229,72,77,.3);}
.btn-success{background:rgba(47,174,104,.1);color:var(--success);border:1px solid rgba(47,174,104,.3);}

/* ---------- Nav ---------- */
#navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,19,48,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.nav-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:1.15rem;}
.logo svg{flex-shrink:0;}
.logo span.tag{display:block;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:.62rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-top:1px;}
.nav-links{display:flex;align-items:center;gap:6px;}
.nav-links a{color:rgba(255,255,255,.75);font-size:.92rem;font-weight:500;padding:9px 14px;border-radius:8px;transition:.15s;position:relative;}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.06);}
.nav-links a.active{color:#fff;background:rgba(59,108,255,.25);}
.nav-search{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:8px 14px;min-width:230px;
}
.nav-search input{background:transparent;border:none;outline:none;color:#fff;width:100%;font-size:.88rem;}
.nav-search input::placeholder{color:rgba(255,255,255,.4);}
.nav-search svg{flex-shrink:0;opacity:.6;}
.nav-right{display:flex;align-items:center;gap:10px;}
.burger{display:none;color:#fff;}
@media(max-width:900px){
  .nav-links{display:none;}
  .nav-search{display:none;}
  .burger{display:flex;}
}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:radial-gradient(1200px 500px at 20% -10%, #14235a 0%, var(--navy) 55%),var(--navy);
  color:#fff;padding:100px 0 90px;
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}.hero-visual{order:-1;}}
.hero h1{font-size:3rem;line-height:1.08;margin:18px 0 16px;font-weight:800;}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero p.lead{color:rgba(255,255,255,.72);font-size:1.08rem;max-width:520px;margin-bottom:30px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap;}
.hero-stats .stat b{display:block;font-family:'Sora',sans-serif;font-size:1.5rem;color:#fff;}
.hero-stats .stat span{font-size:.78rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;}
@media(max-width:640px){.hero h1{font-size:2.1rem;}}

.hero-visual{position:relative;height:380px;display:flex;align-items:center;justify-content:center;}
.astra-orb{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(245,166,35,.25), rgba(59,108,255,.12) 55%, transparent 70%);filter:blur(2px);animation:pulse 5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.08);opacity:1;}}
.arrow-track{position:relative;z-index:2;}
.arrow-track svg{animation:float 4.5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0px) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}

/* ---------- Sections ---------- */
.section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
.section-head h2{font-size:2.1rem;margin:14px 0 12px;}
.section-head p{color:var(--muted);font-size:1.02rem;}
.section-dark{background:var(--navy);color:#fff;}
.section-dark .section-head p{color:rgba(255,255,255,.6);}

/* Class cards */
.class-card{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;overflow:hidden;transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  opacity:0;transform:translateY(24px);
}
.class-card.reveal{opacity:1;transform:translateY(0);}
.class-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent;}
.class-card .notch{position:absolute;top:-30px;right:-30px;width:90px;height:90px;background:linear-gradient(135deg,var(--blue),var(--gold));opacity:.12;border-radius:50%;}
.class-card .num{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.08em;}
.class-card h3{font-size:1.4rem;margin:10px 0 6px;}
.class-card p{color:var(--muted);font-size:.85rem;margin-bottom:16px;}
.class-card .go{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:.86rem;}
.class-card:hover .go svg{transform:translateX(4px);}
.class-card .go svg{transition:transform .18s;}

/* Features strip */
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.feature .ic{width:42px;height:42px;border-radius:10px;background:rgba(59,108,255,.1);display:flex;align-items:center;justify-content:center;color:var(--blue);margin-bottom:14px;}
.feature h4{font-size:1.02rem;margin-bottom:6px;}
.feature p{color:var(--muted);font-size:.86rem;}

/* Subject cards */
.subject-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;display:flex;flex-direction:column;}
.subject-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);}
.subject-thumb{height:120px;display:flex;align-items:center;justify-content:center;position:relative;}
.subject-thumb svg{width:46px;height:46px;color:#fff;}
.subject-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1;}
.subject-body h3{font-size:1.15rem;}
.subject-body p.desc{color:var(--muted);font-size:.86rem;flex:1;}
.price-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px;}
.price-chip{background:var(--offwhite);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.78rem;flex:1;min-width:120px;}
.price-chip b{display:block;font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--navy);}
.subject-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.subject-actions .btn{flex:1;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:100px;}
.badge-unlocked{background:rgba(47,174,104,.12);color:var(--success);}
.badge-pending{background:rgba(245,166,35,.14);color:#B36B00;}

/* Class hero / breadcrumb */
.class-hero{background:linear-gradient(120deg,var(--navy) 0%, var(--navy-3) 100%);color:#fff;padding:52px 0 40px;}
.breadcrumb{font-size:.82rem;color:rgba(255,255,255,.55);margin-bottom:14px;}
.breadcrumb a:hover{color:var(--gold);}
.bundle-banner{
  margin-top:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
}
.bundle-banner h4{font-size:1.05rem;margin-bottom:4px;}
.bundle-banner p{color:rgba(255,255,255,.6);font-size:.85rem;}

/* Footer */
footer{background:var(--navy);color:rgba(255,255,255,.7);padding:60px 0 26px;margin-top:0;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;margin-bottom:40px;}
@media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.footer-grid{grid-template-columns:1fr;}}
.footer-grid h5{color:#fff;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;font-family:'Sora',sans-serif;}
.footer-grid a,.footer-grid p{display:block;color:rgba(255,255,255,.55);font-size:.88rem;margin-bottom:10px;}
.footer-grid a:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.8rem;color:rgba(255,255,255,.4);}

/* WhatsApp float */
.wa-float{
  position:fixed;bottom:24px;right:24px;z-index:200;
  width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -6px rgba(37,211,102,.6);
  transition:transform .2s;
}
.wa-float:hover{transform:scale(1.08);}

/* Page container generic */
.page{min-height:60vh;}

/* Forms / admin */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--navy);}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=number],.field textarea,.field select{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;outline:none;transition:.15s;background:#fff;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:80px;}
.field-hint{font-size:.76rem;color:var(--muted-2);margin-top:5px;}
.file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;font-size:.85rem;color:var(--muted);cursor:pointer;transition:.15s;}
.file-drop:hover{border-color:var(--blue);color:var(--blue);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;}}

/* Admin layout */
.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start;}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr;}}
.admin-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:sticky;top:90px;}
.admin-side button{width:100%;text-align:left;padding:11px 14px;border-radius:9px;font-size:.9rem;font-weight:500;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:10px;}
.admin-side button:hover{background:var(--offwhite);color:var(--ink);}
.admin-side button.active{background:var(--blue);color:#fff;}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
@media(max-width:800px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.stat-card b{font-family:'Sora',sans-serif;font-size:1.6rem;display:block;}
.stat-card span{font-size:.78rem;color:var(--muted);}
.table{width:100%;border-collapse:collapse;font-size:.86rem;}
.table th{text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1.5px solid var(--line);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.table tr:hover td{background:var(--offwhite);}
.row-actions{display:flex;gap:6px;}
.thumb-mini{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--offwhite);}
.tag-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;}
.tag-icon svg{width:18px;height:18px;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,19,48,.55);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{font-size:1.2rem;}
.close-x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.close-x:hover{background:var(--offwhite);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 22px;border-radius:10px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow-lg);z-index:400;display:flex;align-items:center;gap:10px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state svg{margin:0 auto 14px;opacity:.35;}

/* Reader */
.reader-shell{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start;}
@media(max-width:800px){.reader-shell{grid-template-columns:1fr;}}
.reader-pdf{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:640px;}
.reader-pdf iframe{width:100%;height:640px;border:none;display:block;}
.locked-box{background:var(--navy);color:#fff;border-radius:var(--radius);padding:60px 30px;text-align:center;}
.locked-box svg{margin:0 auto 18px;color:var(--gold);}

/* QR box */
.qr-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;}
.qr-canvas-wrap{width:220px;height:220px;margin:0 auto 14px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;}
.upi-id-box{background:var(--offwhite);border:1px dashed var(--line);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;}

/* animated reveal */
.reveal-on-scroll{opacity:0;transform:translateY(26px);transition:opacity .6s ease, transform .6s ease;}
.reveal-on-scroll.in{opacity:1;transform:translateY(0);}

.status-pill{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:100px;display:inline-block;}
.status-pending{background:rgba(245,166,35,.14);color:#B36B00;}
.status-approved{background:rgba(47,174,104,.14);color:var(--success);}
.status-rejected{background:rgba(229,72,77,.14);color:var(--danger);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="syncBanner"></div>
<div id="navbar"></div>
<div id="app"></div>
<div id="footer"></div>
<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.28.58-.36.78-.36h.56c.18 0 .42-.01.65.5.24.53.82 1.85.9 1.98.07.13.12.29.02.47-.09.19-.14.3-.27.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.37-.23.62-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.06.12.06.7-.18 1.38z"/></svg>
</a>
<div id="toastHost"></div>

<script>
/* =========================================================
   BRAHMASTRA NOTES HUB — single-file demo application
   NOTE: This is a fully interactive front-end prototype.
   All data (classes, subjects, notes, payments) lives in
   in-memory JS state for this session, standing in for a
   real backend + database + file storage + auth + payment
   gateway that a production deployment would need. See the
   "Admin" panel for the CMS-style workflow this is modeling.
   ========================================================= */

/* ---------------- ICONS ---------------- */
const ICONS = {

    const id = 'c'+n;

}

function seed(){
  const batch = fdb.batch();
  const classNums = [6,7,8,9,10,11,12];
  classNums.forEach(n=>{
    const id = 'c'+n;
    batch.set(fdb.collection('classes').doc(id), {name:'Class '+n, bundlePrice:199});
    const list = n>=11 ? seniorSubjects : stdSubjects;
    list.forEach(s=>{
      const sid = id+'-'+slug(s.name);
      batch.set(fdb.collection('subjects').doc(sid), {
        classId: id, name: s.name, desc: s.desc, icon: s.icon,
        priceSingle: 99, pdfData: null, pdfName: null,
      });
    });
  });
  batch.set(fdb.collection('settings').doc('site'), DEFAULT_SETTINGS);
  return batch.commit();
}

/* Resize + compress an image file so it comfortably fits inside a Firestore document (1MB/doc limit) */
function compressImage(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Live listeners — public data (classes/subjects/settings) is always on, so every visitor sees admin updates instantly */
let syncError = null; // set + shown as a banner if live sync ever fails, on ANY device

async function startPublicListeners(){
  // One-time safety check: if Firestore has never been seeded, seed it fully BEFORE listening,
  // so a single admin edit later never looks like "the whole catalog" and wipes everything else out.
  try{
    const check = await fdb.collection('classes').limit(1).get();
    if(check.empty) await seed();
  }catch(e){ console.error('initial seed check failed', e); syncError = e.message||String(e); }

  unsubClasses = fdb.collection('classes').onSnapshot(snap=>{
    firestoreClassesEmpty = snap.empty;
    DB.classes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    fbReady = true; syncError = null; render();
  }, err=>{ console.error('classes listener', err); syncError = err.message||String(err); render(); });

  unsubSubjects = fdb.collection('subjects').onSnapshot(snap=>{
    DB.subjects = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ console.error('subjects listener', err); syncError = err.message||String(err); render(); });

  unsubSettings = fdb.collection('settings').doc('site').onSnapshot(doc=>{
    const data = doc.exists ? doc.data() : {};
    DB.settings = {...DEFAULT_SETTINGS, ...data};
    if(!DB.settings.qrImage) DB.settings.qrImage = DEFAULT_SETTINGS.qrImage; // never lose the scanner even if the field is empty/missing in Firestore
    render(); renderFooter();
  }, err=>{ console.error('settings listener', err); syncError = err.message||String(err); render(); });
}

/* Purchases listener: admin sees everything, everyone else sees only purchases made from this device */
function startPurchasesListener(){
  if(unsubPurchases) { unsubPurchases(); unsubPurchases=null; }
  if(adminAuthed){
    // Admin sees every purchase, across every student/device — this is what makes approvals visible everywhere
    unsubPurchases = fdb.collection('purchases').onSnapshot(snap=>{
      DB.purchases = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, err=>console.error('purchases (admin) listener', err));
  } else {
    unsubPurchases = fdb.collection('purchases').where('deviceId','==',deviceId).onSnapshot(snap=>{
      myPurchases = snap.docs.map(d=>({id:d.id, ...d.data()}));
      DB.purchases = myPurchases; // used by isUnlocked/pendingFor below
      render();
    }, err=>console.error('purchases (mine) listener', err));
  }
}
startPublicListeners();

function parseRoute(){
  const h = (location.hash || '#/home').replace('#/','');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  if(qs){ qs.split('&').forEach(p=>{ const [k,v]=p.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v||''); }); }
  return {parts, params};
}

function toast(msg, kind){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = (kind==='err'? ICONS.x : ICONS.check) + `<span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

function isUnlocked(subjectId){
  const sub = DB.subjects.find(s=>s.id===subjectId);
  if(!sub) return false;
  return DB.purchases.some(p=>p.status==='approved' && (
    (p.type==='single' && p.subjectId===subjectId) ||
    (p.type==='bundle' && p.classId===sub.classId)
  ));
}
function pendingFor(subjectId, type){
  const sub = DB.subjects.find(s=>s.id===subjectId);
  return DB.purchases.some(p=>p.status==='pending' && (
    (type==='single' && p.type==='single' && p.subjectId===subjectId) ||
    (type==='bundle' && p.type==='bundle' && p.classId===sub.classId)
  ));
}

/* ---------------- REVEAL ON SCROLL ---------------- */
function initReveal(){
  const els = document.querySelectorAll('.reveal-on-scroll, .class-card');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); e.target.classList.add('reveal'); io.unobserve(e.target);} });
  },{threshold:.12});
  els.forEach(el=>io.observe(el));
}

function placeholderQR(){
  // deterministic pseudo-QR pattern purely for visual placeholder
  let cells='';
  let seedn=42;
  function rnd(){ seedn=(seedn*9301+49297)%233280; return seedn/233280; }
  for(let y=0;y<11;y++){ for(let x=0;x<11;x++){
    const onFinder = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    const on = onFinder || rnd()>0.55;
    if(on) cells+=`<rect x="${x*18}" y="${y*18}" width="16" height="16" fill="#0A1330"/>`;
  }}
  return `<svg width="198" height="198" viewBox="0 0 198 198">${cells}</svg>`;
}

function openModal(html){
  const wrap = document.createElement('div');
  wrap.className='modal-overlay';
  wrap.id='modalOverlay';
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',(e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){ const m=document.getElementById('modalOverlay'); if(m) m.remove(); }

function subjectFormModal(existing){
  const isEdit = !!existing;
  const iconOptions = Object.keys(ICON_COLORS).map(k=>`<option value="${k}" ${existing&&existing.icon===k?'selected':''}>${k}</option>`).join('');
  const classOptions = DB.classes.map(c=>`<option value="${c.id}" ${existing&&existing.classId===c.id?'selected':''}>${c.name}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit subject':'Add new subject'}</h3><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
    <form id="subjectForm">
      <div class="two-col">
        <div class="field"><label>Subject name</label><input type="text" id="sfName" required value="${existing?existing.name:''}"></div>
        <div class="field"><label>Class</label><select id="sfClass">${classOptions}</select></div>
      </div>
      <div class="field"><label>Short description</label><textarea id="sfDesc">${existing?existing.desc:''}</textarea></div>
      <div class="two-col">
        <div class="field"><label>Single subject price (₹)</label><input type="number" id="sfPrice" value="${existing?existing.priceSingle:99}"></div>
        <div class="field"><label>Icon style</label><select id="sfIcon">${iconOptions}</select></div>
      </div>
      <div class="field">
        <label>Notes PDF ${existing&&existing.pdfName?'(replace existing: '+existing.pdfName+')':''}</label>
        <div class="file-drop" id="sfPdfDrop">${ICONS.upload}<div style="margin-top:6px;" id="sfPdfDropLabel">${existing&&existing.pdfName?existing.pdfName:'Click to upload PDF'}</div></div>
        <input type="file" id="sfPdfInput" accept="application/pdf" style="display:none">
        <p class="field-hint">Keep the PDF under ~900KB (mostly text, few/no big images) — larger files can't be saved. Compress at ilovepdf.com/compress_pdf if needed.</p>
      </div>
      <button class="btn btn-primary btn-block" type="submit">${isEdit?'Save changes':'Add subject'}</button>
    </form>
  `);
  let pdfData = (existing && existing.pdfData) || null, pdfName = (existing && existing.pdfName) || null;
  const MAX_PDF_BYTES = 900*1024;
  document.getElementById('sfPdfDrop').onclick = ()=>document.getElementById('sfPdfInput').click();
  document.getElementById('sfPdfInput').onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    if(f.size > MAX_PDF_BYTES){
      toast('That PDF is too large ('+Math.round(f.size/1024)+'KB) — please compress it under 900KB and try again', 'err');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{ pdfData = reader.result; pdfName = f.name; document.getElementById('sfPdfDropLabel').textContent = f.name; };
    reader.readAsDataURL(f);
  };
  document.getElementById('subjectForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    const name = document.getElementById('sfName').value.trim();
    const classId = document.getElementById('sfClass').value;
    const desc = document.getElementById('sfDesc').value.trim();
    const priceSingle = parseInt(document.getElementById('sfPrice').value)||99;
    const icon = document.getElementById('sfIcon').value;
    try{
      if(isEdit){
        await fdb.collection('subjects').doc(existing.id).set({name,classId,desc,priceSingle,icon,pdfData,pdfName}, {merge:true});
        toast('Subject updated');
      } else {
        const sid = classId+'-'+slug(name)+'-'+Date.now().toString(36);
        await fdb.collection('subjects').doc(sid).set({classId,name,desc,priceSingle,icon,pdfData,pdfName});
        toast('Subject added');
      }
      closeModal();
    }catch(err){ toast('Could not save: '+(err.message||err), 'err'); btn.disabled=false; }
  };
}

/* ---------------- MAIN RENDER ---------------- */
function renderAll(){
  renderNav(); renderFooter(); render();
}
function render(){
  const {parts, params} = parseRoute();
  const app = document.getElementById('app');
  let html = '';
  const p0 = parts[0]||'home';
  if(p0==='home') html = pageHome(params);
  else if(p0==='class') html = pageClass(parts[1]);
  else if(p0==='payment') html = pagePayment(params);
  else if(p0==='notes') html = pageNotes(parts[1]);
  else if(p0==='about') html = pageAbout();
  else if(p0==='account') html = pageAccount();
  else if(p0==='admin') html = pageAdmin();
  else html = pageNotFound();
  app.innerHTML = `<div class="page">${html}</div>`;
  const syncBanner = document.getElementById('syncBanner');
  if(syncBanner) syncBanner.innerHTML = syncError ? `
    <div style="background:#fdecea;border-bottom:1px solid #f5c2c0;color:#8a1f1a;font-size:.82rem;padding:8px 16px;text-align:center;">
      ⚠ Live update failed to load (${syncError}). Some data on this device may be out of date — check your internet connection, or ask admin to confirm Firestore rules are published.
    </div>` : '';
  renderNav();
  wireEvents(p0, params);
  initReveal();
}

function wireEvents(page, params){
  if(page==='payment'){
    const drop = document.getElementById('ssDrop');
    const input = document.getElementById('ssInput');
    let ssData = null;
    if(drop){
      drop.onclick = ()=>input.click();
      input.onchange = async (e)=>{
        const f = e.target.files[0]; if(!f) return;
        document.getElementById('ssPreview').innerHTML = `<p style="font-size:.82rem;color:var(--muted);">Processing image…</p>`;
        try{
          ssData = await compressImage(f, 900, 0.72);
          document.getElementById('ssPreview').innerHTML = `<img src="${ssData}" style="width:100%;max-width:220px;border-radius:8px;border:1px solid var(--line);">`;
        }catch(err){
          console.error(err); toast('Could not read that image, try another one', 'err');
        }
      };
    }
    const copyBtn = document.getElementById('copyUpiBtn');
    if(copyBtn) copyBtn.onclick = ()=>{ navigator.clipboard?.writeText(DB.settings.upiId); toast('UPI ID copied'); };
    const form = document.getElementById('payForm');
    if(form) form.onsubmit = async (e)=>{
      e.preventDefault();
      if(!ssData){ toast('Please upload your payment screenshot', 'err'); return; }
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
      const purchase = {
        deviceId: deviceId,
        subjectId: params.subjectId||null,
        classId: params.classId || (params.subjectId? (DB.subjects.find(s=>s.id===params.subjectId)?.classId || null) : null),
        type: params.type||'single',
        status:'pending',
        name: document.getElementById('payName').value.trim(),
        phone: document.getElementById('payPhone').value.trim(),
        txnId: document.getElementById('payTxn').value.trim(),
        screenshot: ssData,
        createdAt: Date.now(),
      };
      try{
        await fdb.collection('purchases').add(purchase);
        document.getElementById('paySuccessBox').innerHTML = `
          <div style="background:rgba(47,174,104,.1);border:1px solid rgba(47,174,104,.3);border-radius:10px;padding:16px;margin-bottom:18px;">
            <b style="color:var(--success);">Payment submitted ✓</b>
            <p style="font-size:.85rem;color:var(--muted);margin-top:4px;">We'll verify it shortly and unlock your notes automatically — on this account, on any device. Track status anytime from "My Profile".</p>
          </div>`;
        form.reset(); document.getElementById('ssPreview').innerHTML=''; ssData=null;
        toast('Payment submitted for verification');
      }catch(err){
        console.error(err); toast('Could not submit — check your connection and try again', 'err');
      }finally{
        submitBtn.disabled = false; submitBtn.textContent = 'Submit payment for verification';
      }
    };
  }

  if(page==='admin'){
    const loginForm = document.getElementById('adminLoginForm');
    if(loginForm) loginForm.onsubmit = (e)=>{
      e.preventDefault();
      const val = document.getElementById('adminPass').value;
      if(val===ADMIN_PASSWORD){
        adminAuthed=true;
        startPurchasesListener(); // now pulls ALL purchases (admin view) instead of just "my purchases"
        toast('Welcome back, admin');
        render();
      } else toast('Incorrect password','err');
    };
    const logoutBtn = document.getElementById('adminLogoutBtn');
    if(logoutBtn) logoutBtn.onclick = ()=>{
      adminAuthed=false;
      startPurchasesListener(); // back to normal (logged-out or student) purchases view
      render();
    };

    document.querySelectorAll('.admin-side [data-tab]').forEach(btn=>{
      btn.onclick = ()=>{ currentAdminTab = btn.dataset.tab; render(); };
    });

    // classes tab
    const addClassBtn = document.getElementById('addClassBtn');
    if(addClassBtn) addClassBtn.onclick = classFormModal;
    document.querySelectorAll('.del-class').forEach(b=>b.onclick=async ()=>{
      const id=b.dataset.id;
      if(confirm('Delete this class and all its subjects?')){
        try{
          const batch = fdb.batch();
          DB.subjects.filter(s=>s.classId===id).forEach(s=>batch.delete(fdb.collection('subjects').doc(s.id)));
          batch.delete(fdb.collection('classes').doc(id));
          await batch.commit();
          toast('Class deleted');
        }catch(err){ toast('Could not delete: '+(err.message||err), 'err'); }
      }
    });
    document.querySelectorAll('.edit-bundle').forEach(b=>b.onclick=async ()=>{
      const c = DB.classes.find(c=>c.id===b.dataset.id);
      const val = prompt('New bundle price for '+c.name, c.bundlePrice);
      if(val && !isNaN(val)){
        try{ await fdb.collection('classes').doc(c.id).set({bundlePrice:parseInt(val)}, {merge:true}); toast('Bundle price updated'); }
        catch(err){ toast('Could not update: '+(err.message||err), 'err'); }
      }
    });

    // subjects tab
    const addSubjectBtn = document.getElementById('addSubjectBtn');
    if(addSubjectBtn) addSubjectBtn.onclick = ()=>subjectFormModal(null);
    document.querySelectorAll('.edit-subject').forEach(b=>b.onclick=()=>{
      subjectFormModal(DB.subjects.find(s=>s.id===b.dataset.id));
    });
    document.querySelectorAll('.del-subject').forEach(b=>b.onclick=async ()=>{
      if(confirm('Delete this subject?')){
        try{ await fdb.collection('subjects').doc(b.dataset.id).delete(); toast('Subject deleted'); }
        catch(err){ toast('Could not delete: '+(err.message||err), 'err'); }
      }
    });

    // payments tab
    document.querySelectorAll('.approve-pay').forEach(b=>b.onclick=async ()=>{
      const p = DB.purchases.find(p=>p.id===b.dataset.id);
      const note = prompt('Add an approval note (optional) — this will always stay visible against this student:', p.note||'');
      try{
        await fdb.collection('purchases').doc(p.id).update({
          status:'approved', approvedAt: Date.now(), approvedBy:'Admin', note: note!==null? note.trim() : (p.note||''),
        });
        toast('Payment approved — notes unlocked on the student\'s account, everywhere');
      }catch(err){ toast('Could not approve: '+(err.message||err), 'err'); }
    });
    document.querySelectorAll('.reject-pay').forEach(b=>b.onclick=async ()=>{
      const p = DB.purchases.find(p=>p.id===b.dataset.id);
      try{
        await fdb.collection('purchases').doc(p.id).update({status:'rejected', rejectedAt: Date.now()});
        toast('Payment rejected','err');
      }catch(err){ toast('Could not reject: '+(err.message||err), 'err'); }
    });
    document.querySelectorAll('.view-ss').forEach(b=>b.onclick=()=>{
      screenshotModal(DB.purchases.find(p=>p.id===b.dataset.id));
    });

    // settings tab
    const seedBtn = document.getElementById('seedDataBtn');
    if(seedBtn) seedBtn.onclick = async ()=>{
      seedBtn.disabled = true; seedBtn.textContent = 'Loading…';
      try{ await seed(); toast('Default classes & subjects loaded'); }
      catch(err){ toast('Could not load defaults: '+(err.message||err), 'err'); seedBtn.disabled=false; seedBtn.textContent='Load default classes & subjects'; }
    };
    const qrDrop = document.getElementById('qrDrop');
    if(qrDrop){
      const qrInput = document.getElementById('qrInput');
      qrDrop.onclick = ()=>qrInput.click();
      qrInput.onchange = async (e)=>{
        const f=e.target.files[0]; if(!f) return;
        try{
          const dataUrl = await compressImage(f, 500, 0.8);
          await fdb.collection('settings').doc('site').set({qrImage: dataUrl}, {merge:true});
          toast('QR image uploaded');
        }catch(err){ toast('Could not upload: '+(err.message||err), 'err'); }
      };
    }
    const settingsForm = document.getElementById('settingsForm');
    if(settingsForm) settingsForm.onsubmit = async (e)=>{
      e.preventDefault();
      try{
        await fdb.collection('settings').doc('site').set({
          upiId: document.getElementById('setUpi').value.trim(),
          whatsapp: document.getElementById('setWa').value.trim(),
          siteEmail: document.getElementById('setEmail').value.trim(),
          sitePhone: document.getElementById('setPhone').value.trim(),
        }, {merge:true});
        toast('Settings saved');
      }catch(err){ toast('Could not save: '+(err.message||err), 'err'); }
    };
  }
}

/* ---------------- INIT ---------------- */
renderAll();
</script>
</body>
</html>
